name: Check Models

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install groq
        run: pip install groq
      
      - name: Check available models
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        run: python check_models.py
